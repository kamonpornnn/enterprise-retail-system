services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-retail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: retail_app
      POSTGRES_PASSWORD: retail_dev_password
      TZ: Asia/Bangkok

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_app -d retail_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: