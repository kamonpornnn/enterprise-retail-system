<header class="page-header">
  <div>
    <span class="eyebrow" *ngIf="eyebrow">{{ eyebrow }}</span>
    <h1>{{ title }}</h1>
    <p *ngIf="description">{{ description }}</p>
  </div>

  <button
    mat-flat-button
    color="primary"
    type="button"
    *ngIf="actionLabel"
    (click)="actionClick.emit()"
  >
    <mat-icon>play_arrow</mat-icon>
    {{ actionLabel }}
  </button>
</header>
