<section class="empty-state" aria-live="polite">
  <mat-icon class="empty-icon" aria-hidden="true">inventory_2</mat-icon>
  <h2>{{ title }}</h2>
  <p>{{ description }}</p>
  <button
    mat-stroked-button
    color="primary"
    type="button"
    *ngIf="actionLabel"
    (click)="actionClick.emit()"
  >
    <mat-icon>add</mat-icon>
    {{ actionLabel }}
  </button>
</section>
